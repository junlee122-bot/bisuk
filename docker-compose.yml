# 연구실 서버 배포 예시 — docs/DEPLOYMENT.md 참고
#   cp .env.example .env   # 값 채우기
#   docker compose up -d --build
# 웹만 외부(3100)에 노출하고, API는 컨테이너 내부 네트워크에서만 받는다.
services:
  api:
    build:
      context: .
      target: runtime
    image: seokmun-studio:latest
    working_dir: /app/apps/api
    command: ["node", "--import", "tsx", "src/index.ts"]
    environment:
      NODE_ENV: production
      SEOKMUN_AUTH_MODE: ${SEOKMUN_AUTH_MODE:-local}
      SEOKMUN_ALLOWED_ORIGINS: ${SEOKMUN_PUBLIC_ORIGIN:-http://localhost:3100}
      # HTTPS 리버스 프록시 뒤라면 1, 연구실 내부 HTTP로만 쓸 때만 0
      SEOKMUN_COOKIE_SECURE: ${SEOKMUN_COOKIE_SECURE:-0}
      SEOKMUN_SEED_DEMO: ${SEOKMUN_SEED_DEMO:-1}
      SEOKMUN_MAX_UPLOAD_BYTES: ${SEOKMUN_MAX_UPLOAD_BYTES:-8589934592}
      # proxy-header(SSO) 모드일 때만
      SEOKMUN_TRUSTED_PROXY_IPS: ${SEOKMUN_TRUSTED_PROXY_IPS:-127.0.0.1}
      SEOKMUN_PROXY_SHARED_SECRET: ${SEOKMUN_PROXY_SHARED_SECRET:-}
      # 첫 기동 시 PI 계정을 만들려면 (없으면 웹의 /setup 화면에서 생성)
      SEOKMUN_BOOTSTRAP_ADMIN_EMAIL: ${SEOKMUN_BOOTSTRAP_ADMIN_EMAIL:-}
      SEOKMUN_BOOTSTRAP_ADMIN_PASSWORD: ${SEOKMUN_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - seokmun-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      target: runtime
      args:
        SEOKMUN_API_URL: http://api:4100
    image: seokmun-studio:latest
    working_dir: /app/apps/web
    command: ["node_modules/.bin/next", "start", "-p", "3100"]
    environment:
      NODE_ENV: production
    ports:
      - "${SEOKMUN_WEB_PORT:-3100}:3100"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  seokmun-data:
