# P1 인프라 스텁 — P0는 SQLite + 로컬 파일로 동작하며 이 compose는 필요 없다.
# PostgreSQL/pgvector·Redis·MinIO 이전 시 사용할 기본 구성.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: seokmun
      POSTGRES_USER: seokmun
      POSTGRES_PASSWORD: seokmun-dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: seokmun
      MINIO_ROOT_PASSWORD: seokmun-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
